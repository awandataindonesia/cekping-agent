name: Release Agent

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Linux (amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/cekping-agent-linux-amd64 ./cmd/agent

      - name: Build Linux (arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/cekping-agent-linux-arm64 ./cmd/agent

      - name: Build FreeBSD (amd64)
        run: CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/cekping-agent-freebsd-amd64 ./cmd/agent

      - name: Build FreeBSD (arm64)
        run: CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go build -ldflags="-s -w" -o dist/cekping-agent-freebsd-arm64 ./cmd/agent

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cekping-agent-binaries
          path: dist/*
          retention-days: 5

      - name: Delete old staging release
        if: github.ref_name == 'staging'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete staging --cleanup-tag -y || true

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.1.{0}', github.run_number) || github.ref_name }}
          name: ${{ github.ref_name == 'main' && format('CekPing Agent v1.1.{0}', github.run_number) || github.ref_name }}
          files: |
            dist/cekping-agent-linux-amd64
            dist/cekping-agent-linux-arm64
            dist/cekping-agent-freebsd-amd64
            dist/cekping-agent-freebsd-arm64
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

  build-docker:
    name: Build & Push Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: cekping-agent-binaries
          path: dist

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
