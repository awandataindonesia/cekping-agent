name: Release Agent

on:
  push:
    tags:
      - 'v*'
    branches:
      - feature/build-arm64-container

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/cekping-agent-linux-amd64 ./cmd/agent

      - name: Build Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/cekping-agent-linux-arm64 ./cmd/agent

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cekping-agent-binaries
          path: dist/*
          retention-days: 5

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.1.{0}', github.run_number) || format('test-{0}', github.sha) }}
          name: ${{ github.ref_name == 'main' && format('CekPing Agent v1.1.{0}', github.run_number) || format('Test Build {0}', github.ref_name) }}
          files: |
            dist/cekping-agent-linux-amd64
            dist/cekping-agent-linux-arm64
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v') }}

  build-docker:
    name: Build & Push Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: cekping-agent-binaries
          path: dist

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
